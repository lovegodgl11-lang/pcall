    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navrose Virtual Desktop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI,Inter,sans-serif&display=swap');
        body {
            font-family: 'Segoe UI', 'Inter', sans-serif;
            background: url('https://images.unsplash.com/photo-1485470733090-0aae1788d5af?q=80&w=2187&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            user-select: none;
        }
        #desktop {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 40px; /* Space for taskbar */
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            grid-auto-rows: 120px;
            gap: 15px;
            align-content: start;
        }
        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .desktop-icon:hover {
            background-color: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
        .desktop-icon img {
            width: 64px;
            height: 64px;
            margin-bottom: 8px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }
        .desktop-icon .icon-label {
            color: white;
            font-size: 14px;
            font-weight: 500;
            text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.9);
            word-break: break-word;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .window {
            position: absolute;
            background-color: #fdfdfd;
            border: 1px solid #ccc;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            min-width: 320px;
            min-height: 240px;
            resize: both;
            overflow: auto; /* Changed from hidden to auto for resize handles */
        }
        .window.maximized {
            top: 0 !important; left: 0 !important; width: 100% !important; height: calc(100% - 40px) !important; resize: none; border-radius: 0;
        }
        .window .title-bar {
            background-color: #2d3748; /* Darker title bar */
            color: #fff;
            padding: 6px 8px;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #4a5568;
        }
        .window .title-bar .title {
            font-weight: 600;
            font-size: 14px;
        }
        .window .window-controls button {
            width: 28px; height: 28px; border: none; background: none; font-size: 16px; font-weight: bold; cursor: pointer; color: #fff; border-radius: 4px; transition: background-color 0.2s;
        }
        .window .window-controls .minimize:hover { background-color: #4a5568; }
        .window .window-controls .maximize:hover { background-color: #4a5568; }
        .window .window-controls .close:hover { background-color: #e53e3e; }
        .window .window-body { flex-grow: 1; position: relative; }
        .window .window-body iframe {
            width: 100%; height: 100%; border: none;
        }
        #taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            padding: 0 8px;
        }
        .taskbar-item {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 4px 12px;
            margin: 0 4px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .taskbar-item.active {
            background-color: rgba(255, 255, 255, 0.25);
            border-bottom: 3px solid #38b2ac; /* Teal color */
        }

        #context-menu {
            position: absolute;
            display: none;
            background-color: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border-radius: 8px;
            padding: 8px;
            z-index: 10000;
            min-width: 220px;
        }
        #context-menu button {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px 12px;
            border: none;
            background: none;
            text-align: left;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            border-radius: 6px;
        }
        #context-menu button:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }
        #context-menu button svg {
            width: 18px;
            height: 18px;
        }
    </style>



    <div id="desktop"></div>

    <div id="taskbar">
        <!-- Taskbar items will be added here -->
    </div>
    
    <div id="context-menu">
        <button data-action="popup">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25"></path></svg>
            Open in Popup Window
        </button>
        <button data-action="newWindow">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-4.5 4.5V6H18"></path></svg>
            Open in New Tab
        </button>
        <button data-action="sameWindow">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 11.667 0l3.181-3.183m-4.991-2.691v4.992h4.992"></path></svg>
            Open in Same Tab
        </button>
    </div>

    <!-- Templates -->
    <template id="icon-template">
        <div class="desktop-icon">
            <img src="" alt="icon">
            <span class="icon-label"></span>
        </div>
    </template>

    <template id="window-template">
        <div class="window">
            <div class="title-bar">
                <span class="title">Window</span>
                <div class="window-controls">
                    <button class="minimize" title="Minimize">_</button>
                    <button class="maximize" title="Maximize">□</button>
                    <button class="close" title="Close">×</button>
                </div>
            </div>
            <div class="window-body">
                <iframe src="" frameborder="0"></iframe>
            </div>
        </div>
    </template>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC0_DQIiyaVQllFH4pxH1Dm3r2kFXXoOgc",
            authDomain: "navrosetailorapp.firebaseapp.com",
            databaseURL: "https://navrosetailorapp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "navrosetailorapp",
            storageBucket: "navrosetailorapp.firebasestorage.app",
        };
        
        let db;
        const desktop = document.getElementById('desktop');
        const taskbar = document.getElementById('taskbar');
        const contextMenu = document.getElementById('context-menu');
        
        let openWindows = new Map();
        let zIndexCounter = 10;
        let activeWindowId = null;
        let currentLinkData = null;

        function getFaviconUrl(url) {
            try {
                const domain = new URL(url).hostname;
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
            } catch (e) {
                return 'https://img.icons8.com/color/96/000000/file.png'; // Default icon
            }
        }

        function createDesktopIcon(linkData) {
            const template = document.getElementById('icon-template');
            const clone = template.content.cloneNode(true);
            const iconDiv = clone.querySelector('.desktop-icon');
            iconDiv.querySelector('img').src = getFaviconUrl(linkData.url);
            iconDiv.querySelector('img').onerror = function() { this.src = 'https://img.icons8.com/color/96/000000/file.png'; };
            iconDiv.querySelector('.icon-label').textContent = linkData.name;
            
            iconDiv.addEventListener('click', (e) => showContextMenu(e, linkData));
            desktop.appendChild(clone);
        }
        
        function showContextMenu(event, linkData) {
            event.preventDefault();
            event.stopPropagation(); // <-- CRITICAL FIX: Prevents document click from firing immediately
            contextMenu.style.display = 'block';
            
            // Adjust position if it's too close to the edge
            const menuWidth = contextMenu.offsetWidth;
            const menuHeight = contextMenu.offsetHeight;
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            let left = event.clientX;
            let top = event.clientY;

            if (left + menuWidth > viewportWidth) {
                left = viewportWidth - menuWidth - 10;
            }
            if (top + menuHeight > viewportHeight) {
                top = viewportHeight - menuHeight - 10;
            }
            
            contextMenu.style.left = `${left}px`;
            contextMenu.style.top = `${top}px`;
            currentLinkData = linkData;
        }
        
        function hideContextMenu() {
             contextMenu.style.display = 'none';
             currentLinkData = null;
        }

        function openLink(action) {
            if (!currentLinkData) return;
            switch (action) {
                case 'popup':
                    createWindow(currentLinkData.id, currentLinkData.name, currentLinkData.url);
                    break;
                case 'newWindow':
                    window.open(currentLinkData.url, '_blank');
                    break;
                case 'sameWindow':
                    window.location.href = currentLinkData.url;
                    break;
            }
            hideContextMenu();
        }

        function createWindow(id, title, url) {
            if (openWindows.has(id)) {
                focusWindow(id);
                return;
            }

            const template = document.getElementById('window-template');
            const clone = template.content.cloneNode(true);
            const win = clone.querySelector('.window');
            win.id = `window-${id}`;
            win.querySelector('.title').textContent = title;
            win.querySelector('iframe').src = url;

            document.body.appendChild(win);
            
            const windowData = { element: win, minimized: false, savedState: {} };
            openWindows.set(id, windowData);
            
            makeDraggable(win.querySelector('.title-bar'), win);
            setupWindowControls(id, win);
            addToTaskbar(id, title);
            focusWindow(id);

            win.style.top = `${50 + (openWindows.size * 20) % (window.innerHeight - 300)}px`;
            win.style.left = `${100 + (openWindows.size * 20) % (window.innerWidth - 400)}px`;
        }

        function focusWindow(id) {
            if (activeWindowId) {
                const oldActive = openWindows.get(activeWindowId);
                if(oldActive) {
                    oldActive.element.style.zIndex = zIndexCounter - 1;
                    document.getElementById(`taskbar-${activeWindowId}`)?.classList.remove('active');
                }
            }
            const windowData = openWindows.get(id);
            if(windowData) {
                windowData.element.style.zIndex = zIndexCounter++;
                document.getElementById(`taskbar-${id}`)?.classList.add('active');
                activeWindowId = id;

                if(windowData.minimized) {
                    windowData.element.style.display = 'flex';
                    windowData.minimized = false;
                }
            }
        }

        function closeWindow(id) {
            const windowData = openWindows.get(id);
            if (windowData) {
                windowData.element.remove();
                openWindows.delete(id);
                document.getElementById(`taskbar-${id}`).remove();
            }
        }
        
        function minimizeWindow(id) {
            const windowData = openWindows.get(id);
            if(windowData) {
                windowData.element.style.display = 'none';
                windowData.minimized = true;
                document.getElementById(`taskbar-${id}`)?.classList.remove('active');
                activeWindowId = null;
            }
        }
        
        function toggleMaximizeWindow(id) {
            const windowData = openWindows.get(id);
            if(windowData) {
                if(windowData.element.classList.contains('maximized')) {
                    // Restore
                    windowData.element.classList.remove('maximized');
                    windowData.element.style.top = windowData.savedState.top;
                    windowData.element.style.left = windowData.savedState.left;
                    windowData.element.style.width = windowData.savedState.width;
                    windowData.element.style.height = windowData.savedState.height;
                } else {
                    // Maximize
                    windowData.savedState = {
                        top: windowData.element.style.top,
                        left: windowData.element.style.left,
                        width: windowData.element.style.width,
                        height: windowData.element.style.height
                    };
                    windowData.element.classList.add('maximized');
                }
            }
        }

        function setupWindowControls(id, win) {
            win.addEventListener('mousedown', () => focusWindow(id));
            win.querySelector('.close').addEventListener('click', () => closeWindow(id));
            win.querySelector('.minimize').addEventListener('click', () => minimizeWindow(id));
            win.querySelector('.maximize').addEventListener('click', () => toggleMaximizeWindow(id));
            win.querySelector('.title-bar').addEventListener('dblclick', () => toggleMaximizeWindow(id));
        }

        function addToTaskbar(id, title) {
            const item = document.createElement('div');
            item.className = 'taskbar-item';
            item.id = `taskbar-${id}`;
            item.textContent = title.substring(0, 15) + (title.length > 15 ? '…' : '');
            item.title = title;
            item.addEventListener('click', () => focusWindow(id));
            taskbar.appendChild(item);
        }

        function makeDraggable(dragHandle, elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            dragHandle.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                if (e.target.tagName === 'BUTTON' || elmnt.classList.contains('maximized')) return;
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                const linksRef = db.ref('desktop_links');
                linksRef.on('value', (snapshot) => {
                    desktop.innerHTML = ''; // Clear desktop
                    const links = snapshot.val();
                    if (links) {
                        Object.values(links).forEach(createDesktopIcon);
                    }
                });
            } catch(e) { 
                console.error(e);
                alert("Firebase connection failed."); 
            }
            
            // Context menu logic
            document.addEventListener('click', (e) => {
                if (!contextMenu.contains(e.target)) {
                    hideContextMenu();
                }
            });
            contextMenu.addEventListener('click', (e) => {
                const button = e.target.closest('button');
                if (button) {
                    openLink(button.dataset.action);
                }
            });
        });
    </script>



<script src="./script.js"></script></body></html>
