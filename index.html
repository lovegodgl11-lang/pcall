    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI,Inter,sans-serif&display=swap');

        }
        .window.maximized {
            top: 0 !important; left: 0 !important; width: 100% !important; height: calc(100% - 40px) !important; resize: none; border-radius: 0;
            transition: none;
        }
        .window .title-bar {
            background-color: #2d3748; /* Darker title bar */

            width: 28px; height: 28px; border: none; background: none; font-size: 16px; font-weight: bold; cursor: pointer; color: #fff; border-radius: 4px; transition: background-color 0.2s;
        }
        .window .window-controls .minimize:hover { background-color: #4a5568; }
        .window .window-controls .refresh:hover { background-color: #4a5568; }

        .window .window-body { flex-grow: 1; position: relative; }

        .resizer::after {

        }
        .window.maximized .resizer {
            display: none;

        #taskbar {
            position: absolute;
            bottom: 0;

            height: 40px;
            background-color: rgba(0, 0, 0, 0.5);

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC0_DQIiyaVQllFH4pxH1Dm3r2kFXXoOgc",
            authDomain: "navrosetailorapp.firebaseapp.com",
            databaseURL: "https://navrosetailorapp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "navrosetailorapp",
            storageBucket: "navrosetailorapp.firebasestorage.app",
        };
        
        let db;
        const desktop = document.getElementById('desktop');
        const taskbarItems = document.getElementById('taskbar-items');
        const contextMenu = document.getElementById('context-menu');
        
        let openWindows = new Map();
        let zIndexCounter = 10;
        let activeWindowId = null;
        let currentLinkData = null;

        // --- Centralized Drag & Resize State ---
        let actionState = {
            active: false,
            type: null, // 'drag' or 'resize'
            target: null,
            startX: 0,
            startY: 0,
            initialLeft: 0,
            initialTop: 0,
            initialWidth: 0,
            initialHeight: 0
        };

        // --- Global Event Handlers for Drag/Resize ---
        function handleActionMove(e) {
            if (!actionState.active) return;
            e.preventDefault();

            if (actionState.type === 'drag') {
                const dx = e.clientX - actionState.startX;
                const dy = e.clientY - actionState.startY;
                actionState.target.style.left = `${actionState.initialLeft + dx}px`;
                actionState.target.style.top = `${actionState.initialTop + dy}px`;
            } else if (actionState.type === 'resize') {
                const dw = e.clientX - actionState.startX;
                const dh = e.clientY - actionState.startY;
                const newWidth = actionState.initialWidth + dw;
                const newHeight = actionState.initialHeight + dh;
                const minWidth = parseInt(getComputedStyle(actionState.target).minWidth, 10);
                const minHeight = parseInt(getComputedStyle(actionState.target).minHeight, 10);
                
                if (newWidth >= minWidth) actionState.target.style.width = `${newWidth}px`;
                if (newHeight >= minHeight) actionState.target.style.height = `${newHeight}px`;
            }
        }

        function handleActionEnd(e) {
            if (!actionState.active) return;
            const overlay = document.getElementById('global-action-overlay');
            if (overlay) {
                overlay.remove();
            }
            actionState.active = false;
            actionState.target = null;
        }

        window.addEventListener('mousemove', handleActionMove);
        window.addEventListener('mouseup', handleActionEnd);
        window.addEventListener('mouseleave', handleActionEnd); // Handle mouse leaving the browser window

        // --- Core Functions ---
        function getFaviconUrl(url) {
            try {
                const domain = new URL(url).hostname;
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
            } catch (e) {
                return 'https://img.icons8.com/color/96/000000/file.png'; // Default icon
            }
        }

        function createDesktopIcon(linkData) {
            const template = document.getElementById('icon-template');
            const clone = template.content.cloneNode(true);
            const iconDiv = clone.querySelector('.desktop-icon');
            iconDiv.querySelector('img').src = getFaviconUrl(linkData.url);
            iconDiv.querySelector('img').onerror = function() { this.src = 'https://img.icons8.com/color/96/000000/file.png'; };
            iconDiv.querySelector('.icon-label').textContent = linkData.name;
            
            iconDiv.addEventListener('click', (e) => showContextMenu(e, linkData));
            desktop.appendChild(clone);
        }
        
        function showContextMenu(event, linkData) {
            event.preventDefault();
            event.stopPropagation();
            contextMenu.style.display = 'block';
            
            const menuWidth = contextMenu.offsetWidth;
            const menuHeight = contextMenu.offsetHeight;
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            let left = event.clientX;
            let top = event.clientY;

            if (left + menuWidth > viewportWidth) left = viewportWidth - menuWidth - 10;
            if (top + menuHeight > viewportHeight) top = viewportHeight - menuHeight - 10;
            
            contextMenu.style.left = `${left}px`;
            contextMenu.style.top = `${top}px`;
            currentLinkData = linkData;
        }
        
        function hideContextMenu() {
             contextMenu.style.display = 'none';
             currentLinkData = null;
        }

        function openLink(action) {
            if (!currentLinkData) return;
            switch (action) {
                case 'popup':
                    createWindow(currentLinkData.id, currentLinkData.name, currentLinkData.url);
                    break;
                case 'newWindow':
                    window.open(currentLinkData.url, '_blank');
                    break;
                case 'sameWindow':
                    window.location.href = currentLinkData.url;
                    break;
            }
            hideContextMenu();
        }

        function createWindow(id, title, url) {
            if (openWindows.has(id)) {
                focusWindow(id);
                return;
            }

            const template = document.getElementById('window-template');
            const clone = template.content.cloneNode(true);
            const win = clone.querySelector('.window');
            win.id = `window-${id}`;
            win.querySelector('.title').textContent = title;
            win.querySelector('iframe').src = url;

            const initialWidth = 800;
            const initialHeight = 600;
            win.style.width = `${initialWidth}px`;
            win.style.height = `${initialHeight}px`;

            const viewportHeight = window.innerHeight - 40;
            const viewportWidth = window.innerWidth;
            const top = 50 + (openWindows.size * 25) % Math.max(1, viewportHeight - initialHeight);
            const left = 100 + (openWindows.size * 25) % Math.max(1, viewportWidth - initialWidth);
            win.style.top = `${top}px`;
            win.style.left = `${left}px`;
            
            document.body.appendChild(win);
            
            const windowData = { element: win, minimized: false, savedState: {} };
            openWindows.set(id, windowData);
            
            setupWindowInteractions(id, win);
            addToTaskbar(id, title);
            focusWindow(id);
        }

        function focusWindow(id) {
            if (activeWindowId && activeWindowId !== id) {
                const oldActive = openWindows.get(activeWindowId);
                if(oldActive) {
                    oldActive.element.style.zIndex = zIndexCounter - 1;
                    document.getElementById(`taskbar-${activeWindowId}`)?.classList.remove('active');
                }
            }
            const windowData = openWindows.get(id);
            if(windowData) {
                windowData.element.style.zIndex = zIndexCounter++;
                document.getElementById(`taskbar-${id}`)?.classList.add('active');
                activeWindowId = id;

                const wasMinimized = windowData.minimized;
                if(wasMinimized) {
                    windowData.element.style.display = 'flex';
                    windowData.minimized = false;
                }
            }
        }

        function closeWindow(id) {
            const windowData = openWindows.get(id);
            if (windowData) {
                windowData.element.remove();
                openWindows.delete(id);
                document.getElementById(`taskbar-${id}`).remove();
            }
        }
        
        function minimizeWindow(id) {
            const windowData = openWindows.get(id);
            if(windowData) {
                windowData.element.style.display = 'none';
                windowData.minimized = true;
                document.getElementById(`taskbar-${id}`)?.classList.remove('active');
                if (activeWindowId === id) {
                    activeWindowId = null;
                }
            }
        }
        
        function toggleMaximizeWindow(id) {
            const windowData = openWindows.get(id);
            if(windowData) {
                const win = windowData.element;
                if(win.classList.contains('maximized')) {
                    win.classList.remove('maximized');
                    Object.assign(win.style, windowData.savedState);
                } else {
                    windowData.savedState = {
                        top: win.style.top,
                        left: win.style.left,
                        width: win.style.width,
                        height: win.style.height
                    };
                    win.classList.add('maximized');
                }
            }
        }

        function setupWindowInteractions(id, win) {
            const titleBar = win.querySelector('.title-bar');
            const resizer = win.querySelector('.resizer');
            
            win.addEventListener('mousedown', () => focusWindow(id), true); // Use capture phase
            
            win.querySelector('.close').addEventListener('click', () => closeWindow(id));
            win.querySelector('.minimize').addEventListener('click', () => minimizeWindow(id));
            win.querySelector('.maximize').addEventListener('click', () => toggleMaximizeWindow(id));
            win.querySelector('.refresh').addEventListener('click', () => {
                const iframe = win.querySelector('iframe');
                if (iframe) {
                    // Using reload(true) forces a reload from the server, bypassing the cache.
                    iframe.contentWindow.location.reload(true);
                }
            });
            titleBar.addEventListener('dblclick', () => toggleMaximizeWindow(id));
            
            const startAction = (e, type) => {
                if ((type === 'drag' && e.target.tagName === 'BUTTON') || win.classList.contains('maximized')) return;
                e.preventDefault();
                focusWindow(id);
                
                actionState.active = true;
                actionState.type = type;
                actionState.target = win;
                actionState.startX = e.clientX;
                actionState.startY = e.clientY;

                const style = window.getComputedStyle(win);
                if (type === 'drag') {
                    actionState.initialLeft = parseInt(style.left, 10) || 0;
                    actionState.initialTop = parseInt(style.top, 10) || 0;
                } else {
                    actionState.initialWidth = parseInt(style.width, 10);
                    actionState.initialHeight = parseInt(style.height, 10);
                }
                
                const overlay = document.createElement('div');
                overlay.id = 'global-action-overlay';
                overlay.style.cssText = `
                    position: fixed;
                    top: 0; left: 0;
                    width: 100vw; height: 100vh;
                    z-index: 10000;
                    cursor: ${type === 'drag' ? 'move' : 'nwse-resize'};
                `;
                document.body.appendChild(overlay);
            };
            
            titleBar.addEventListener('mousedown', (e) => startAction(e, 'drag'));
            resizer.addEventListener('mousedown', (e) => startAction(e, 'resize'));
        }

        function addToTaskbar(id, title) {
            const item = document.createElement('div');
            item.className = 'taskbar-item';
            item.id = `taskbar-${id}`;
            item.textContent = title.substring(0, 15) + (title.length > 15 ? '…' : '');
            item.title = title;
            item.addEventListener('click', () => focusWindow(id));
            taskbarItems.appendChild(item);
        }
        
        function applyLayout(layoutType) {
            const visibleWindows = Array.from(openWindows.values()).filter(w => !w.minimized);
            if (visibleWindows.length === 0) return;

            const desktopWidth = window.innerWidth;
            const desktopHeight = window.innerHeight - 40;
            const gap = 8;

            const applyStyles = (win, styles) => {
                win.element.classList.remove('maximized');
                Object.assign(win.element.style, styles);
            };

            switch(layoutType) {
                case 'focus': {
                    const target = activeWindowId ? openWindows.get(activeWindowId) : visibleWindows[0];
                    if (target) {
                        applyStyles(target, { top: `0px`, left: `0px`, width: `${desktopWidth}px`, height: `${desktopHeight}px` });
                        visibleWindows.forEach(w => {
                            if (w !== target) minimizeWindow(w.element.id.replace('window-', ''));
                        });
                    }
                    break;
                }
                case 'horizontal-split': {
                    const targets = visibleWindows.slice(0, 2);
                    if (targets.length === 0) break;
                    
                    const width = (desktopWidth - 3 * gap) / 2;
                    const height = desktopHeight - 2 * gap;
                    
                    if (targets[0]) applyStyles(targets[0], { top: `${gap}px`, left: `${gap}px`, width: `${width}px`, height: `${height}px` });
                    if (targets[1]) applyStyles(targets[1], { top: `${gap}px`, left: `${width + 2 * gap}px`, width: `${width}px`, height: `${height}px` });
                    
                    visibleWindows.slice(2).forEach(w => minimizeWindow(w.element.id.replace('window-', '')));
                    break;
                }
                case 'vertical-split': {
                    const targets = visibleWindows.slice(0, 2);
                     if (targets.length === 0) break;

                    const width = desktopWidth - 2 * gap;
                    const height = (desktopHeight - 3 * gap) / 2;
                    
                    if (targets[0]) applyStyles(targets[0], { top: `${gap}px`, left: `${gap}px`, width: `${width}px`, height: `${height}px` });
                    if (targets[1]) applyStyles(targets[1], { top: `${height + 2 * gap}px`, left: `${gap}px`, width: `${width}px`, height: `${height}px` });

                    visibleWindows.slice(2).forEach(w => minimizeWindow(w.element.id.replace('window-', '')));
                    break;
                }
                case 'three-panel': {
                    const targets = visibleWindows.slice(0, 3);
                    if (targets.length === 0) break;

                    const topHeight = (desktopHeight - 3 * gap) / 2;
                    const topWidth = (desktopWidth - 3 * gap) / 2;
                    const bottomHeight = topHeight;
                    const bottomWidth = desktopWidth - 2 * gap;

                    // Top two windows
                    if (targets[0]) applyStyles(targets[0], { top: `${gap}px`, left: `${gap}px`, width: `${topWidth}px`, height: `${topHeight}px` });
                    if (targets[1]) applyStyles(targets[1], { top: `${gap}px`, left: `${topWidth + 2 * gap}px`, width: `${topWidth}px`, height: `${topHeight}px` });

                    // Bottom window
                    if (targets[2]) applyStyles(targets[2], { top: `${topHeight + 2 * gap}px`, left: `${gap}px`, width: `${bottomWidth}px`, height: `${bottomHeight}px` });
                    
                    // Minimize the rest
                    visibleWindows.slice(3).forEach(w => minimizeWindow(w.element.id.replace('window-', '')));
                    break;
                }
                case 'quadrant': {
                    const targets = visibleWindows.slice(0, 4);
                    if (targets.length === 0) break;
                    
                    const width = (desktopWidth - 3 * gap) / 2;
                    const height = (desktopHeight - 3 * gap) / 2;
                    
                    if (targets[0]) applyStyles(targets[0], { top: `${gap}px`, left: `${gap}px`, width: `${width}px`, height: `${height}px` });
                    if (targets[1]) applyStyles(targets[1], { top: `${gap}px`, left: `${width + 2 * gap}px`, width: `${width}px`, height: `${height}px` });
                    if (targets[2]) applyStyles(targets[2], { top: `${height + 2 * gap}px`, left: `${gap}px`, width: `${width}px`, height: `${height}px` });
                    if (targets[3]) applyStyles(targets[3], { top: `${height + 2 * gap}px`, left: `${width + 2 * gap}px`, width: `${width}px`, height: `${height}px` });
                    
                    visibleWindows.slice(4).forEach(w => minimizeWindow(w.element.id.replace('window-', '')));
                    break;
                }
            }
        }


        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                const linksRef = db.ref('desktop_links');
                linksRef.on('value', (snapshot) => {
                    desktop.innerHTML = ''; // Clear desktop
                    const links = snapshot.val();
                    if (links) {
                        Object.values(links).forEach(createDesktopIcon);
                    }
                });
            } catch(e) { 
                console.error(e);
                alert("Firebase connection failed."); 
            }
            
            // Context menu logic
            document.addEventListener('click', (e) => {
                if (!contextMenu.contains(e.target)) {
                    hideContextMenu();
                }
            });
            contextMenu.addEventListener('click', (e) => {
                const button = e.target.closest('button');
                if (button) {
                    openLink(button.dataset.action);
                }
            });
            
            // Tiling controls listeners
            document.getElementById('tile-focus').addEventListener('click', () => applyLayout('focus'));
            document.getElementById('tile-vertical').addEventListener('click', () => applyLayout('vertical-split'));
            document.getElementById('tile-horizontal').addEventListener('click', () => applyLayout('horizontal-split'));
            document.getElementById('tile-three-panel').addEventListener('click', () => applyLayout('three-panel'));
            document.getElementById('tile-quadrant').addEventListener('click', () => applyLayout('quadrant'));
        });
    </script>
